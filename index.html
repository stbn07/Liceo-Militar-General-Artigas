<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cámara QR</title>

<style>
    body{
        margin:0;
        background:#111;
        color:white;
        font-family:Arial;
        text-align:center;
    }

    video{
        width:100%;
        height:90vh;
        object-fit:cover;
    }

    button{
        padding:15px 25px;
        margin:10px;
        font-size:18px;
        border:none;
        border-radius:10px;
        background:#00aaff;
        color:white;
    }
</style>
</head>
<body>

<h2>Cámara del celular</h2>

<video id="video" autoplay playsinline></video>

<br>

<button onclick="cambiarCamara()">
Cambiar Cámara
</button>

<script>
let video = document.getElementById("video");
let currentStream;
let usandoFrontal = false;

async function iniciarCamara() {

    if(currentStream){
        currentStream.getTracks().forEach(track => track.stop());
    }

    let constraints = {
        video: {
            facingMode: usandoFrontal ? "user" : "environment"
        }
    };

    try{
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
    }catch(err){
        alert("No se pudo abrir la cámara");
        console.log(err);
    }
}

function cambiarCamara(){
    usandoFrontal = !usandoFrontal;
    iniciarCamara();
}

iniciarCamara();
</script>

</body>
</html>
