<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cámara</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
}

video{
    width:100%;
    height:80vh;
    object-fit:cover;
    background:black;
}

button{
    padding:15px 25px;
    margin:10px;
    font-size:18px;
    border:none;
    border-radius:10px;
    background:#00aaff;
    color:white;
}

canvas{
    display:none;
}
</style>
</head>
<body>

<h2>¡Sacate una foto con nosotros!</h2>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<br>

<button id="switchBtn">Cambiar Cámara</button>
<button id="photoBtn">Tomar Foto</button>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const switchBtn = document.getElementById("switchBtn");
const photoBtn = document.getElementById("photoBtn");

let currentStream;
let usandoFrontal = false;

// PEGA AQUÍ TU URL DE GOOGLE APPS SCRIPT
const SCRIPT_URL = "https://script.google.com/macros/library/d/1kXFBr6HqcMgv-neaGTNR69M19QjIz6VR9dvoqf1UX6RE1zadsD5U5EJ4/2";

async function iniciarCamara(){

    try{

        if(currentStream){
            currentStream.getTracks().forEach(track => track.stop());
        }

        const constraints = {
            video:{
                facingMode: usandoFrontal ? "user" : "environment"
            },
            audio:false
        };

        currentStream = await navigator.mediaDevices.getUserMedia(constraints);

        video.srcObject = currentStream;

    }catch(error){
        console.error(error);
        alert("Error al abrir la cámara");
    }
}

switchBtn.addEventListener("click", ()=>{
    usandoFrontal = !usandoFrontal;
    iniciarCamara();
});

photoBtn.addEventListener("click", async ()=>{

    try{

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        const ctx = canvas.getContext("2d");

        ctx.drawImage(video,0,0,canvas.width,canvas.height);

        const imageData = canvas.toDataURL("image/jpeg",0.9);

        const response = await fetch(SCRIPT_URL,{
            method:"POST",
            mode:"cors",
            headers:{
                "Content-Type":"text/plain"
            },
            body: JSON.stringify({
                image:imageData
            })
        });

        const text = await response.text();
        const data = JSON.parse(text);

        if(data.success){
            alert("Foto subida a Google Drive");
            console.log(data.url);
        }else{
            alert("No se pudo guardar la foto");
        }

    }catch(error){
        console.error(error);
        alert("Error enviando la foto");
    }
});

iniciarCamara();
</script>

</body>
</html>
